<!doctype html>
<!--
  A data graphic: one real response from the product (an API or MCP result, a config, a log)
  in a code island, centred on the page ground. Paste the real payload, trimmed to what reads
  (drop hashes and long URLs, keep the fields that prove the point). Keys go in <span class="k">.
  Shoot with frame.mjs, no target, viewport 1100x688 (16:10), dpr 2.2 for a 2400px export.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Tokens and fonts: the product's own. Light by default here, to mix with dark shots. */
      @font-face {
        font-family: Brand;
        src: url(brand-font.woff2);
      }
      @font-face {
        font-family: BrandMono;
        src: url(brand-mono.woff2);
      }
      :root {
        --ink: #e8e8e8;
        --fg: #0a0a0b;
        --muted: #5f5f66;
        --line: #c9c9c9;
        --radius: 4px;
      }
      html[data-theme="dark"] {
        --ink: #0a0a0b;
        --fg: #ededef;
        --muted: #7c7c84;
        --line: #2a2a2e;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        color: var(--fg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .island {
        width: 620px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        font: 12px/1.75 BrandMono, "SF Mono", ui-monospace, monospace;
      }
      .head {
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        font: 13px Brand, "Inter", system-ui, sans-serif;
      }
      .head span,
      .k {
        color: var(--muted);
      }
      pre {
        margin: 0;
        padding: 16px;
        white-space: pre-wrap;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div class="island">
      <div class="head">tool_name<span>argument · value</span></div>
<pre>{
  <span class="k">"key"</span>: "value",
  <span class="k">"source"</span>: { <span class="k">"title"</span>: "Where it came from" }
}</pre>
    </div>
    <script>
      const theme = new URLSearchParams(location.search).get("theme");
      if (theme) document.documentElement.dataset.theme = theme;
    </script>
  </body>
</html>
